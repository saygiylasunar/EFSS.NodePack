name: EFSS NodePack CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Python and Markdown contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python syntax
        run: python -m compileall -q __init__.py tests
      - name: Python unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: JavaScript syntax
        run: |
          node --check web/efss_extension.js
          node --check web/markdown.mjs
          node --check web/editor_text.mjs
          node --check web/decorations_extension.js
          node --check web/decorations.mjs
      - name: Markdown preview tests
        run: node --test tests/*.test.mjs
      - name: Theme JSON validation
        run: |
          python -m json.tool themes/efss-midnight.json > /dev/null
          python -c "import json; p=json.load(open('themes/efss-midnight.json')); assert p['id']=='efss-midnight'; assert {'node_slot','litegraph_base','comfy_base'} <= set(p['colors'])"
